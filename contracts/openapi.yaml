            properties:
              category_id: {$ref: '#/components/schemas/Identifier'}
              category_name: {type: string}
              category_total_amount: {type: integer, format: int64}
              sub_category_list:
                type: array
                items:
                  type: object
                  required: [sub_category_id, sub_category_name, sub_category_total_amount, transaction_list]
                  properties:
                    sub_category_id: {$ref: '#/components/schemas/Identifier'}
                    sub_category_name: {type: string}
                    sub_category_total_amount: {type: integer, format: int64}
                    transaction_list:
                      type: array
                      items:
                        type: object
                        required: [transaction_id, transaction_name, transaction_amount, transaction_date, payment_id, payment_name]
                        properties:
                          transaction_id: {$ref: '#/components/schemas/Identifier'}
                          transaction_name: {type: string}
                          transaction_amount: {type: integer, format: int64}
                          transaction_date: {$ref: '#/components/schemas/DateString'}
                          payment_id: {$ref: '#/components/schemas/NullableIdentifier'}
                          payment_name: {type: [string, 'null']}
    TotalSpendingResponse:
      type: object
      required: [total_spending, category_total_list]
      properties:
        total_spending: {type: integer, format: int64}
        category_total_list:
          type: array
          items:
            type: object
            required: [category_name, category_total_amount, sub_category_list]
            properties:
              category_name: {type: string}
              category_total_amount: {type: integer, format: int64}
              sub_category_list:
                type: array
                items:
                  type: object
                  required: [sub_category_id, sub_category_name, sub_category_total_amount, transaction_list]
                  properties:
                    sub_category_id: {$ref: '#/components/schemas/Identifier'}
                    sub_category_name: {type: string}
                    sub_category_total_amount: {type: integer, format: int64}
                    transaction_list:
                      type: array
                      items:
                        type: object
                        required: [transaction_id, transaction_name, transaction_amount]
                        properties:
                          transaction_id: {$ref: '#/components/schemas/Identifier'}
                          transaction_name: {type: string}
                          transaction_amount: {type: integer, format: int64}
    PaymentGroupResponse:
      type: object
      required: [total_spending, last_month_total_spending, month_over_month_sum, payment_list]
      properties:
        total_spending: {type: integer, format: int64}
        last_month_total_spending: {type: integer, format: int64}
        month_over_month_sum: {type: [number, 'null'], format: double}
        payment_list:
          type: array
          items:
            type: object
            required: [payment_id, payment_name, payment_amount, payment_type_id, payment_type_name, is_payment_due_later, last_month_sum, month_over_month, transaction_list]
            properties:
              payment_id: {$ref: '#/components/schemas/NullableIdentifier'}
              payment_name: {type: string, description: Empty payment name is rewritten to `未分類`.}
              payment_amount: {type: integer, format: int64}
              payment_type_id: {$ref: '#/components/schemas/NullableIdentifier'}
              payment_type_name: {type: string}
              is_payment_due_later: {type: boolean}
              last_month_sum: {type: [integer, 'null'], format: int64}
              month_over_month: {type: [number, 'null'], format: double}
              transaction_list:
                type: array
                items:
                  type: object
                  required: [transaction_id, transaction_name, transaction_amount, transaction_date, category_id, category_name, sub_category_id, sub_category_name, fixed_flg]
                  properties:
                    transaction_id: {$ref: '#/components/schemas/Identifier'}
                    transaction_name: {type: string}
                    transaction_amount: {type: integer, format: int64}
                    transaction_date: {$ref: '#/components/schemas/DateString'}
                    category_id: {$ref: '#/components/schemas/Identifier'}
                    category_name: {type: string}
                    sub_category_id: {$ref: '#/components/schemas/Identifier'}
                    sub_category_name: {type: string}
                    fixed_flg: {type: boolean}
    WithdrawalResponse:
      type: object
      required: [withdrawal_list]
      properties:
        withdrawal_list:
          type: array
          items:
            type: object
            required: [payment_id, payment_name, payment_date, aggregation_start_date, aggregation_end_date, withdrawal_amount]
            properties:
              payment_id: {$ref: '#/components/schemas/Identifier'}
              payment_name: {type: string}
              payment_date: {type: integer}
              aggregation_start_date: {$ref: '#/components/schemas/DateString'}
              aggregation_end_date: {$ref: '#/components/schemas/DateString'}
              withdrawal_amount: {type: integer, format: int64}
    FrequentTransactionResponse:
      type: object
      required: [transaction_list]
      properties:
        transaction_list:
          type: array
          items:
            type: object
            required: [transaction_name, category_id, sub_category_id, fixed_flg, payment_id, category_name, sub_category_name]
            properties:
              transaction_name: {type: string}
              category_id: {$ref: '#/components/schemas/Identifier'}
              sub_category_id: {$ref: '#/components/schemas/Identifier'}
              fixed_flg: {type: boolean}
              payment_id: {$ref: '#/components/schemas/NullableIdentifier'}
              category_name: {type: string}
              sub_category_name: {type: string}
    FixedWrite:
      type: object
      required: [monthly_transaction_name, monthly_transaction_amount, monthly_transaction_sign, monthly_transaction_date, category_id]
      properties:
        monthly_transaction_name: {type: string, maxLength: 32}
        monthly_transaction_amount: {type: integer, format: int64, minimum: 0}
        monthly_transaction_sign: {type: integer, enum: [-1, 1]}
        monthly_transaction_date: {type: integer, description: Day of month; database has no CHECK constraint.}
        category_id: {$ref: '#/components/schemas/Identifier'}
        sub_category_id: {type: string, description: Numeric ID, or empty/omitted to create by name.}
        sub_category_name: {type: string, maxLength: 16}
        payment_id: {type: string, description: Numeric ID, or empty/omitted for database NULL.}
    FixedWriteEnvelope:
      type: object
      additionalProperties: false
      required: [monthly_transaction]
      properties:
        monthly_transaction: {$ref: '#/components/schemas/FixedWrite'}
    FixedEdit:
      allOf:
        - {$ref: '#/components/schemas/FixedWrite'}
        - type: object
          required: [monthly_transaction_id, include_flg]
          properties:
            monthly_transaction_id: {$ref: '#/components/schemas/Identifier'}
            include_flg: {type: boolean}
    FixedEditEnvelope:
      type: object
      additionalProperties: false
      required: [monthly_transaction]
      properties:
        monthly_transaction: {$ref: '#/components/schemas/FixedEdit'}
    FixedListResponse:
      type: object
      required: [monthly_transaction_list]
      properties:
        monthly_transaction_list:
          type: array
          items:
            type: object
            required: [monthly_transaction_id, monthly_transaction_name, monthly_transaction_amount, monthly_transaction_sign, monthly_transaction_date, category_id, category_name, sub_category_id, sub_category_name, payment_id]
            properties:
              monthly_transaction_id: {$ref: '#/components/schemas/Identifier'}
              monthly_transaction_name: {type: string}
              monthly_transaction_amount: {type: integer, format: int64, minimum: 0}
              monthly_transaction_sign: {type: integer, enum: [-1, 1]}
              monthly_transaction_date: {type: integer}
              category_id: {$ref: '#/components/schemas/Identifier'}
              category_name: {type: string}
              sub_category_id: {$ref: '#/components/schemas/Identifier'}
              sub_category_name: {type: string}
              payment_id: {$ref: '#/components/schemas/NullableIdentifier'}
    DeletedFixed:
      type: object
      required: [monthly_transaction_id, monthly_transaction_name, monthly_transaction_amount, monthly_transaction_date, category_name, sub_category_name]
      properties:
        monthly_transaction_id: {$ref: '#/components/schemas/Identifier'}
        monthly_transaction_name: {type: string}
        monthly_transaction_amount: {type: integer, format: int64, minimum: 0}
        monthly_transaction_date: {type: integer}
        category_name: {type: string}
        sub_category_name: {type: string}
    Category:
      type: object
      required: [category_id, category_name]
      properties:
        category_id: {$ref: '#/components/schemas/Identifier'}
        category_name: {type: string}
    Subcategory:
      type: object
      required: [sub_category_id, sub_category_name]
      properties:
        sub_category_id: {$ref: '#/components/schemas/Identifier'}
        sub_category_name: {type: string}
    CategoryListResponse:
      type: object
      required: [category_list]
      properties:
        category_list:
          type: [array, 'null']
          items: {$ref: '#/components/schemas/Category'}
    CategoryWithSubcategoryResponse:
      type: object
      required: [category_list]
      properties:
        category_list:
          type: [array, 'null']
          items:
            allOf:
              - {$ref: '#/components/schemas/Category'}
              - type: object
                required: [sub_category_list]
                properties:
                  sub_category_list:
                    type: array
                    items:
                      allOf:
                        - {$ref: '#/components/schemas/Subcategory'}
                        - type: object
                          required: [enable]
                          properties:
                            enable: {type: boolean}
    SubcategoryListResponse:
      type: object
      required: [sub_category_list]
      properties:
        sub_category_list:
          type: [array, 'null']
          items: {$ref: '#/components/schemas/Subcategory'}
    EditSubcategoryRequest:
      type: object
      additionalProperties: false
      required: [sub_category_id, is_enable]
      description: Runtime request-tag validation is disabled; omitted `is_enable` binds as false.
      properties:
        sub_category_id: {$ref: '#/components/schemas/Identifier'}
        is_enable: {type: boolean}
    PaymentWriteRequest:
      type: object
      required: [payment_name]
      properties:
        payment_name: {type: string, maxLength: 32}
        payment_type_id:
          anyOf:
            - {$ref: '#/components/schemas/Identifier'}
            - {type: 'null'}
        payment_date: {type: [integer, 'null'], description: Intended day of month; no database CHECK constraint.}
        closing_date: {type: [integer, 'null'], description: Intended day of month; no database CHECK constraint.}
    PaymentEditRequest:
      allOf:
        - {$ref: '#/components/schemas/PaymentWriteRequest'}
        - type: object
          required: [payment_id]
          properties:
            payment_id: {$ref: '#/components/schemas/Identifier'}
    PaymentResourceListResponse:
      type: object
      required: [payment_list]
      properties:
        payment_list:
          type: array
          items:
            type: object
            required: [payment_id, payment_name, payment_type_id, payment_date, closing_date]
            properties:
              payment_id: {$ref: '#/components/schemas/Identifier'}
              payment_name: {type: string}
              payment_type_id: {$ref: '#/components/schemas/Identifier'}
              payment_date: {type: [integer, 'null']}
              closing_date: {type: integer, description: Returned as 31 when the database value is null/zero.}
    PaymentTypeListResponse:
      type: object
      required: [payment_type_list]
      properties:
        payment_type_list:
          type: array
          items:
            type: object
            required: [payment_type_id, payment_type_name, is_payment_due_later]
            properties:
              payment_type_id: {$ref: '#/components/schemas/Identifier'}
              payment_type_name: {type: string}
              is_payment_due_later: {type: boolean}
