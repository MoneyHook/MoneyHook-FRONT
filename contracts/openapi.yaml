        category_list:
          type: array
          items:
            type: object
            required: [category_name, category_total_amount, sub_category_list]
            properties:
              category_name: {type: string}
              category_total_amount: {type: integer, format: int64}
              sub_category_list:
                type: array
                items:
                  type: object
                  required: [sub_category_name, sub_category_total_amount]
                  properties:
                    sub_category_name: {type: string}
                    sub_category_total_amount: {type: integer, format: int64}
    MonthlyVariableResponse:
      type: object
      required: [total_variable, monthly_variable_list]
      properties:
