components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Firebase ID token
      description: User-facing business endpoints require a verified Google-provider Firebase ID token.
    SchedulerOidcAuth:
      type: http
      scheme: bearer
      bearerFormat: Google OIDC ID token
      description: The daily job accepts only a Google-signed token for the configured audience and Scheduler service account.
  parameters:
    V1StartDate:
      name: start_date
      in: query
      required: true
      description: Inclusive range start.
      schema: { $ref: '#/components/schemas/DateString' }
    V1EndDate:
      name: end_date
      in: query
      required: true
      description: Inclusive range end. The server does not expand it to month end.
      schema: { $ref: '#/components/schemas/DateString' }
    V1GroupBy:
      name: group_by
      in: query
      required: false
      schema: { type: string, enum: [day, week, month], default: month }
    V1Compare:
      name: compare
      in: query
      required: false
      schema: { type: string, enum: [none, previous_period], default: none }
    Month:
      name: month
      in: query
      required: true
      description: Date passed directly as the range start; callers should send the first day of a month (`YYYY-MM-01`).
      schema: { $ref: '#/components/schemas/DateString' }
    TransactionId:
      name: transactionId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Identifier' }
  responses:
    V1BadRequest:
      description: Invalid JSON, path parameter, or analysis query
      content:
        application/json:
          schema: { $ref: '#/components/schemas/V1ErrorResponse' }
    V1Unauthorized:
      description: Missing, expired, invalid, or non-Google Firebase Bearer token
      content:
        application/json:
          schema: { $ref: '#/components/schemas/V1ErrorResponse' }
    SchedulerUnauthorized:
      description: Missing, expired, invalid, or incorrectly scoped Scheduler OIDC Bearer token
      content:
        application/json:
          schema: { $ref: '#/components/schemas/V1ErrorResponse' }
    V1NotFound:
      description: Resource does not exist or is not owned by this user
      content:
        application/json:
          schema: { $ref: '#/components/schemas/V1ErrorResponse' }
    V1ValidationError:
      description: Field validation failed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/V1ErrorResponse' }
    V1InternalError:
      description: Unexpected database or server failure
      content:
        application/json:
          schema: { $ref: '#/components/schemas/V1ErrorResponse' }
    Success:
      description: Mutation completed (an update/delete affecting zero rows also returns this response)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/SuccessResponse' }
    AuthIdentityConflict:
      description: Firebase UID and the legacy verified-email identity belong to different users
      content:
        application/json:
          schema: { $ref: '#/components/schemas/V1ErrorResponse' }
    MutationFailure:
      description: JSON binding, related subcategory creation, or database mutation failed
      content:
        application/json:
          schema:
            oneOf:
              - { $ref: '#/components/schemas/ErrorResponse' }
              - { type: string, const: error }
    StringMutationFailure:
      description: JSON bind failure (`error`) or database mutation failure (localized plain JSON string)
      content:
        application/json:
          schema: { type: string }
    DeleteFailure:
      description: Database delete failed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { status: error, message: 削除に失敗しました }
  schemas:
    HouseholdShareStatus:
      type: object
