    Identifier:
      type: string
      pattern: '^[0-9]+$'
      description: Numeric database identifier serialized as a string.
    DateString:
      type: string
      format: date
      examples: ['2026-08-01']
    NullableIdentifier:
      anyOf:
        - { $ref: '#/components/schemas/Identifier' }
        - { type: 'null' }
    SuccessResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, const: success }
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [status, message]
      properties:
        status: { type: string, const: error }
        message: { type: string }
    TransactionWrite:
      type: object
      description: Required fields, calendar dates, non-negative amounts, signs, names, and positive signed 64-bit IDs are validated before persistence. Invalid requests return 422. When sub_category_id is omitted or empty, sub_category_name must contain 1 to 16 non-blank characters.
      required:
        [
          transaction_date,
          transaction_amount,
          transaction_sign,
          transaction_name,
          category_id,
          fixed_flg,
        ]
      properties:
        transaction_date: { $ref: '#/components/schemas/DateString' }
        transaction_amount:
          type: integer
          format: int64
          minimum: 0
          description: Non-negative signed 64-bit magnitude; stored as `transaction_amount * transaction_sign`.
        transaction_sign: { type: integer, enum: [-1, 1] }
        transaction_name: { type: string, minLength: 1, maxLength: 32 }
        category_id: { $ref: '#/components/schemas/Identifier' }
        sub_category_id:
          type: string
          description: Numeric ID, or empty/omitted to find/create by `sub_category_name`.
        sub_category_name: { type: string, maxLength: 16 }
        fixed_flg: { type: boolean }
        payment_id:
          type: string
          description: Numeric ID, or empty/omitted for database NULL.
    TransactionWriteEnvelope:
      type: object
      additionalProperties: false
      required: [transaction]
      properties:
        transaction: { $ref: '#/components/schemas/TransactionWrite' }
    TransactionListWriteRequest:
      type: object
      additionalProperties: false
      required: [transaction_list]
      properties:
        transaction_list:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/TransactionWrite' }
    TransactionEdit:
      allOf:
        - { $ref: '#/components/schemas/TransactionWrite' }
        - type: object
          required: [transaction_id]
          properties:
            transaction_id: { $ref: '#/components/schemas/Identifier' }
    TransactionEditEnvelope:
      type: object
      additionalProperties: false
      required: [transaction]
      properties:
        transaction: { $ref: '#/components/schemas/TransactionEdit' }
    TimelineResponse:
