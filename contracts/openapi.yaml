  /api/job/daily:
    post:
      tags: [Job]
      operationId: processDailyJob
      summary: Materialize recurring transactions due today
      description: |
        Intended for Google Cloud Scheduler. On the last day of a month, all enabled recurring rows
        whose configured day is greater than or equal to today are also materialized.
      security: [SchedulerOidcAuth: []]
      parameters:
        - name: User-Agent
          in: header
          required: true
          schema: { type: string, const: Google-Cloud-Scheduler }
        - name: X-CloudScheduler
          in: header
          required: true
          schema: { type: string, const: 'true' }
        - name: X-CloudScheduler-JobName
          in: header
          required: true
          description: Must exactly equal the server's `JOB_NAME` environment variable.
          schema: { type: string }
        - name: X-CloudScheduler-ScheduleTime
          in: header
          required: true
          description: Must be non-empty; the value is not parsed.
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        '200':
          description: Job completed, including the no-op case
          content:
            text/plain:
              schema:
                type: string
                enum: ['Success Jobs', 'Today is Nothing, Success Jobs']
        '401': { $ref: '#/components/responses/SchedulerUnauthorized' }
        '500': { $ref: '#/components/responses/V1InternalError' }
        '403':
          description: The Google identity is not allowed or one or more scheduler headers are invalid
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: '#/components/schemas/V1ErrorResponse' }
                  - { $ref: '#/components/schemas/ErrorResponse' }
        '422':
          description: Database batch insert failed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { status: error, message: Failed to insert transaction }

